<div class="app-shell" [class.is-scrolled]="isScrolled()" [class.is-rtl]="isRtl()" [class.is-light]="isLight()">
  <!-- Sky (sun + clouds) for light mode -->
  <app-sky />

  <!-- Starfield for dark mode -->
  <app-starfield />

  <!-- Animated background orbs (always) -->
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <app-navbar [scrolled]="isScrolled()" />

  <main class="main-content">
    <router-outlet />
  </main>

  <app-footer />
</div>
